name: CI

on:
  push:
    branches:
      - master
      - develop
    tags:
      - v*

  pull_request:
    branches:
      - master
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - name: Run Linter
        run: npm run lint
      - name: Run tests
        run: xvfb-run -a npm run test-with-coverage
      - name: Code coverage
        uses: codecov/codecov-action@v3
      - name: Publish
        if: success() && startsWith( github.ref, 'refs/tags/v')
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
